# =============================================================================
# RavakWP App Builder — GitHub Actions Build (third engine, v1.2.0)
# -----------------------------------------------------------------------------
# Place this file in YOUR repository at .github/workflows/ravakwp-build.yml
# and add three repository Secrets (Settings → Secrets and variables → Actions):
#
#   RVK_SITE_URL   → https://your-store.com
#   RVK_STORE_KEY  → store key from the plugin panel
#   RVK_HMAC_KEY   → build HMAC key from the plugin panel
#
# The build is dispatched from the WordPress panel (plugin sends build_id);
# the runner downloads its own code bundle from your site (HMAC-signed),
# runs the SAME build pipeline as the Docker worker, and delivers APK/AAB
# back to WordPress through the same signed callbacks. No Docker needed.
# =============================================================================

name: RavakWP Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "RavakWP build id (sent automatically by the WordPress panel)"
        required: true
        type: string
      trace:
        description: "Trace note (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ravakwp-build-${{ github.event.inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Android APK/AAB (build ${{ github.event.inputs.build_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RVK_SITE_URL: ${{ secrets.RVK_SITE_URL }}
      RVK_STORE_KEY: ${{ secrets.RVK_STORE_KEY }}
      RVK_HMAC_KEY: ${{ secrets.RVK_HMAC_KEY }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_USER_HOME: /tmp/ravakwp/gradle-home

    steps:
      - name: Show build info
        run: |
          echo "RavakWP build_id = ${{ github.event.inputs.build_id }}"
          echo "trace            = ${{ github.event.inputs.trace }}"
          echo "runner           = $GITHUB_RUN_ID"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Ensure Android SDK packages (platform 34 / build-tools 34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Download runner bundle from WordPress (HMAC-signed)
        env:
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          mkdir -p /tmp/rvk-gh-runner
          python3 - <<'PY'
          import hashlib, hmac, os, time, urllib.request, urllib.error, zipfile, io

          site  = os.environ["RVK_SITE_URL"].strip().rstrip("/")
          store = os.environ["RVK_STORE_KEY"].strip()
          key   = os.environ["RVK_HMAC_KEY"].strip()
          ts    = str(int(time.time()))
          sig   = hmac.new(key.encode(), f"{ts}.".encode(), hashlib.sha256).hexdigest()

          # v1.2.3: a generic User-Agent + "Accept-Encoding: identity" stop
          # CDNs/WAFs (ArvanCloud, Cloudflare, ...) from answering a python
          # client with an HTML challenge page instead of the zip — the exact
          # cause of "bundle download failed: HTTP 200" (200 = HTML, not zip).
          headers = {
              "User-Agent": "ravakwp-gh-runner/1.2 (WordPress plugin)",
              "Accept": "application/zip, */*",
              "Accept-Encoding": "identity",
              "X-RVK-Worker": store,
              "X-RVK-Timestamp": ts,
              "X-RVK-Signature": sig,
          }

          def describe(status, hdrs, data):
              ctype = hdrs.get("Content-Type", "?")
              cenc  = hdrs.get("Content-Encoding", "-")
              head  = data[:300]
              text  = "".join(chr(b) if 32 <= b < 127 or b in (9, 10, 13) else "." for b in head)
              print(f"    status={status} content-type={ctype} content-encoding={cenc} bytes={len(data)}")
              print(f"    body[0:300]={text!r}")

          # Pretty permalinks first; ?rest_route= fallback covers plain
          # permalink setups where /wp-json/... returns the homepage (200 HTML).
          candidates = [
              f"{site}/wp-json/ravakwp/v1/gh/bundle",
              f"{site}/?rest_route=/ravakwp/v1/gh/bundle",
          ]

          data = b""
          for url in candidates:
              print(f"[bundle] GET {url}")
              try:
                  req = urllib.request.Request(url, method="GET", headers=headers)
                  with urllib.request.urlopen(req, timeout=60) as r:
                      status, hdrs, data = r.status, dict(r.headers), r.read()
              except urllib.error.HTTPError as e:
                  print(f"[bundle] HTTPError {e.code}")
                  describe(e.code, dict(e.headers or {}), e.read())
                  data = b""
                  continue
              except Exception as exc:
                  print(f"[bundle] request failed: {exc}")
                  data = b""
                  continue

              if status == 200 and data.startswith(b"PK"):
                  print(f"[bundle] received zip: {len(data)} bytes")
                  break

              print("[bundle] response is NOT a zip — diagnostics:")
              describe(status, hdrs, data)
              data = b""

          if not data:
              raise SystemExit(
                  "bundle download failed: the site never returned a zip. "
                  "Read the diagnostics above. If content-type is text/html, "
                  "a CDN/WAF (ArvanCloud/Cloudflare) or a maintenance/security "
                  "plugin is intercepting /wp-json/* — whitelist that path and "
                  "re-run the job."
              )

          try:
              zipfile.ZipFile(io.BytesIO(data)).extractall("/tmp/rvk-gh-runner")
          except zipfile.BadZipFile as exc:
              raise SystemExit(f"bundle downloaded ({len(data)} bytes) but zip is invalid: {exc}")
          print("bundle extracted OK")
          PY

      - name: Install runner Python dependencies (requests + Pillow)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --upgrade pip
          REQ=/tmp/rvk-gh-runner/ravakwp-gh-runner/requirements.txt
          if [ -f "$REQ" ]; then
            python3 -m pip install --quiet --disable-pip-version-check -r "$REQ"
          else
            python3 -m pip install --quiet --disable-pip-version-check "requests>=2.31" "Pillow>=10.0"
          fi
          python3 -c "import requests, PIL; print('runner deps OK: requests', requests.__version__, '| Pillow', PIL.__version__)"

      - name: Run build (claim → compile → sign → deliver)
        env:
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          python3 /tmp/rvk-gh-runner/ravakwp-gh-runner/runner.py \
            --build-id "$BUILD_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Result
        if: always()
        run: |
          echo "RavakWP build ${{ github.event.inputs.build_id }} finished."
          echo "APK/AAB (if the build completed) are downloadable from the WordPress panel:"
          echo "WordPress → RavakWP App Builder → Build"
